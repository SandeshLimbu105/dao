server:
  port: ${PORT:8082}

spring:
  application:
    name: system-b-dao

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

system:
  a:
    base-url: ${SYSTEM_A_BASE_URL}
    api-key: ${SYSTEM_A_API_KEY}
    timeout-ms: 5000

logging:
  level:
    org.texas.systembdao: INFO
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info